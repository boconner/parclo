databases:
  - name: parclo-db
    plan: free
    region: oregon

services:
  - type: web
    name: parclo-api
    # Free is fine for demos and trials, but it sleeps after 15 minutes idle
    # (~50s cold start) and the free database expires after 30 days. Move
    # customer deployments to `starter` before handover.
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install && ./node_modules/.bin/prisma generate && npm run typecheck
    startCommand: ./node_modules/.bin/prisma db push --accept-data-loss && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: parclo-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: LOCATOR_API_KEY
        sync: false

  # Daily scan for stores where the product isn't moving — no rep visit inside
  # the threshold, or a synced on-shelf count that hasn't budged.
  - type: cron
    name: parclo-stale-alerts
    runtime: node
    rootDir: backend
    schedule: "30 6 * * *"
    buildCommand: npm install && ./node_modules/.bin/prisma generate
    startCommand: npm run alerts:stale
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: parclo-db
          property: connectionString

  - type: web
    name: parclo-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_MAPBOX_TOKEN
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
